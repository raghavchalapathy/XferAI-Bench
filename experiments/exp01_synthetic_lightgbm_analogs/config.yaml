# Experiment 1: M5-style global LightGBM + hierarchical analogs. Default path: no downloads.
id: exp01_synthetic_lightgbm_analogs
title: "Exp01 - M5-style global LightGBM + analogs (synthetic interface test, not rankings)"
papers:
  - citation: "Makridakis, Spiliotis & Assimakopoulos (2022). M5 accuracy competition: Results, findings, and conclusions. International Journal of Forecasting 38(4):1346-1364."
    url: "https://doi.org/10.1016/j.ijforecast.2021.11.013"
  - citation: "Ke et al. (2017). LightGBM: A Highly Efficient Gradient Boosting Decision Tree. NeurIPS 30."
    url: "https://papers.nips.cc/paper/6907-lightgbm-a-highly-efficient-gradient-boosting-decision-tree"
tier: synthetic  # synthetic | sample | complete; overlays in configs/<tier>.yaml
data:
  flavour: synthetic
  preset: tiny
  seed: 42
methods: [B0, B1, B2, B3, M1, M2]
optional_methods: [M4.lightgbm]   # needs: pip install -e ".[lightgbm]" (a wheel, no weights)
runtime:            # config-only switch; same code. backend: polars | spark; mode: local | cluster (spark only)
  backend: polars
  mode: local
