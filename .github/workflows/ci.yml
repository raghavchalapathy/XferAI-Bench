# CI: Linux, macOS and Windows; Python 3.11 and 3.13.
# Actions are pinned to commit SHAs (resolved from api.github.com tag refs on 2026-10-24); the tag is in the comment.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install (core + dev, constrained)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/core.txt -e ".[dev]"
      - name: Lint and type-check
        run: |
          ruff check src tests
          ruff format --check src tests
          python -m mypy
      - name: Tests (fails on any skip not listed for "core" in tests/expected_skips.txt)
        env:
          XFERBENCH_STRICT_SKIPS: core
        run: python -m pytest -rs
      - name: Experiments smoke (synthetic, offline)
        shell: bash
        run: xferbench experiment --config experiments/exp02_synthetic_chronos_zero_shot/config.yaml --out "$RUNNER_TEMP/exp02"
      - name: Build
        run: python -m build
      - name: Wheel install outside the checkout + tiny demo
        shell: bash
        run: |
          WHEEL="$(ls "$PWD"/dist/*.whl)"
          cd "$RUNNER_TEMP"
          python -m venv xb-env
          if [ -x xb-env/bin/python ]; then PY=xb-env/bin/python; XB=xb-env/bin/xferbench; else PY=xb-env/Scripts/python; XB=xb-env/Scripts/xferbench; fi
          "$PY" -m pip install "$WHEEL"
          "$XB" --help
          "$XB" demo --preset tiny --out xb-demo
          "$XB" validate --metadata xb-demo/data/metadata.csv.json
          test -f xb-demo/report.html

  spark-parity:
    # Offline: Spark local[*] on loopback; no data or weights downloaded beyond pip packages.
    runs-on: ubuntu-latest
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install (core + dev + distributed)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/core.txt -e ".[dev,distributed]"
      - name: Spark parity vs protected evaluator (incl. Reviewer adversarial cases); any skip fails the job
        env:
          XFERBENCH_STRICT_SKIPS: spark
        run: python -m pytest -q tests/unit/test_scalable_eval.py tests/review/test_review_adv.py -rs
