# CI: Linux, macOS and Windows; Python 3.11 and 3.13.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install (core + dev, constrained)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/core.txt -e ".[dev]"
      - name: Lint and type-check
        run: |
          ruff check src tests
          ruff format --check src tests
          python -m mypy
      - name: Tests
        run: python -m pytest
      - name: Experiments smoke (synthetic, offline)
        shell: bash
        run: xferbench experiment --config experiments/exp02_chronos_zero_shot/config.yaml --out "$RUNNER_TEMP/exp02"
      - name: Build
        run: python -m build
      - name: Wheel install outside the checkout + tiny demo
        shell: bash
        run: |
          WHEEL="$(ls "$PWD"/dist/*.whl)"
          cd "$RUNNER_TEMP"
          python -m venv xb-env
          if [ -x xb-env/bin/python ]; then PY=xb-env/bin/python; XB=xb-env/bin/xferbench; else PY=xb-env/Scripts/python; XB=xb-env/Scripts/xferbench; fi
          "$PY" -m pip install "$WHEEL"
          "$XB" --help
          "$XB" demo --preset tiny --out xb-demo
          "$XB" validate --metadata xb-demo/data/metadata.csv.json
          test -f xb-demo/report.html

  spark-parity:
    # Offline: Spark local[*] on loopback; no data or weights downloaded beyond pip packages.
    runs-on: ubuntu-latest
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install (core + dev + distributed)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/core.txt -e ".[dev,distributed]"
      - name: Spark parity vs protected evaluator (incl. Reviewer adversarial cases)
        run: python -m pytest -q tests/unit/test_scalable_eval.py tests/review/test_review_adv.py -rs
      - name: Fail if Spark tests were skipped
        run: python -c "import pyspark; from pyspark.sql import SparkSession; SparkSession.builder.master('local[1]').getOrCreate().stop()"
