# CI: Linux, macOS and Windows; Python 3.11 and 3.13.
# Actions are pinned to commit SHAs (resolved from api.github.com tag refs on 2026-10-24); the tag is in the comment.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install (core + dev, constrained)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/core.txt -e ".[dev]"
      - name: Lint and type-check
        run: |
          ruff check src tests
          ruff format --check src tests
          python -m mypy
      - name: Tests (fails on any skip not listed for "core" in tests/expected_skips.txt)
        env:
          XFERBENCH_STRICT_SKIPS: core
        run: python -m pytest -rs
      - name: Experiments smoke (synthetic, offline)
        shell: bash
        run: xferbench experiment --config experiments/exp02_synthetic_chronos_zero_shot/config.yaml --out "$RUNNER_TEMP/exp02"
      - name: Build
        run: python -m build
      - name: Wheel install outside the checkout + tiny demo
        shell: bash
        run: |
          WHEEL="$(ls "$PWD"/dist/*.whl)"
          cd "$RUNNER_TEMP"
          python -m venv xb-env
          if [ -x xb-env/bin/python ]; then PY=xb-env/bin/python; XB=xb-env/bin/xferbench; else PY=xb-env/Scripts/python; XB=xb-env/Scripts/xferbench; fi
          "$PY" -m pip install "$WHEEL"
          "$XB" --help
          "$XB" demo --preset tiny --out xb-demo
          "$XB" validate --metadata xb-demo/data/metadata.csv.json
          test -f xb-demo/report.html

  spark-parity:
    # Offline: Spark local[*] on loopback; no data or weights downloaded beyond pip packages.
    runs-on: ubuntu-latest
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install (core + dev + distributed)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/core.txt -e ".[dev,distributed]"
      - name: Spark parity vs protected evaluator (incl. Reviewer adversarial cases); any skip fails the job
        env:
          XFERBENCH_STRICT_SKIPS: spark
        run: python -m pytest -q tests/unit/test_scalable_eval.py tests/review/test_review_adv.py -rs

  uv:
    # The default install route: uv with the committed lock (uv sync --locked fails if uv.lock is stale).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          python-version: "3.13"
      - name: uv sync --locked (core + dev)
        run: uv sync --locked --extra dev
      - name: Lint and type-check
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run python -m mypy
      - name: Core tests, strict skips
        env:
          XFERBENCH_STRICT_SKIPS: core
        run: uv run python -m pytest -rs

  script-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: shellcheck
        run: shellcheck --version && shellcheck --severity=info xferAI_setup.sh bootstrap.sh

  setup-script:
    # A first-time user's path: the setup script on a fresh checkout, then a rerun (must be idempotent), then the
    # demo command it prints. Unix runs xferAI_setup.sh; Windows runs xferAI_setup.ps1 and PSScriptAnalyzer.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.11"
      - name: Where are bash and uv (diagnostic)
        shell: pwsh
        run: |
          Get-Command bash -All -ErrorAction SilentlyContinue | Format-Table Source
          Get-Command uv -All -ErrorAction SilentlyContinue | Format-Table Source
          git --exec-path
      - name: Fresh run (unix)
        if: runner.os != 'Windows'
        run: bash xferAI_setup.sh --non-interactive
      - name: Rerun (unix)
        if: runner.os != 'Windows'
        run: bash xferAI_setup.sh --non-interactive --no-demo
      - name: Printed next command (unix)
        if: runner.os != 'Windows'
        run: |
          .venv/bin/xferbench experiment run exp01_synthetic_lightgbm_analogs
          test -f eval/exp01_synthetic_lightgbm_analogs__synthetic/report.html
      - name: PSScriptAnalyzer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }
          # -Path takes one string: analyse each file and collect the findings
          $r = @("xferAI_setup.ps1", "bootstrap.ps1") | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ }
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
      - name: Fresh run (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./xferAI_setup.ps1 -NonInteractive
      - name: Rerun (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./xferAI_setup.ps1 -NonInteractive -NoDemo
      - name: Printed next command (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .venv\Scripts\xferbench experiment run exp01_synthetic_lightgbm_analogs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path eval\exp01_synthetic_lightgbm_analogs__synthetic\report.html)) { exit 1 }

  setup-script-pip:
    # The pip fallback: uv hidden, --no-install-uv.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.13"
      - name: Fresh run and rerun with pip
        run: |
          for d in $(command -v -a uv | xargs -r -n1 dirname); do PATH="$(echo "$PATH" | tr ':' '\n' | grep -vx "$d" | paste -sd:)"; done
          if command -v uv; then echo "uv still on PATH"; exit 1; fi
          bash xferAI_setup.sh --non-interactive --no-install-uv
          bash xferAI_setup.sh --non-interactive --no-install-uv --no-demo
          grep -q "pip" .xferai-setup.log
