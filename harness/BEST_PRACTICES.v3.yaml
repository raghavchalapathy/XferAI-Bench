version: 3
review_date: '2026-10-25'
review_every_days: 90
rules:
  scope: Cold-start only. Objective 0.5*WMAPE(PAIR0-E) + 0.5*WMAPE(PAIR0-N). The evaluator
    is protected.
  data_prep_shared: One pipeline for complete, sample and synthetic data. Polars +
    uv by default; PySpark only where size needs it.
  pyspark_native: 'PySpark: no toPandas, native functions only, no multi-step aggregations
    without asking the user, prefer simple steps.'
  flag_not_fix: Flag data issues (duplicate keys, negative units) rather than silently
    fixing them.
  scalable_models: Scalable libraries (e.g. SynapseML LightGBM on Spark, optional
    extra). Local on sample/synthetic, cluster for complete, every family.
  no_download_default: Weight-based models are adapters reported config_required offline.
    Default path downloads nothing.
  rate_fallback: 'Rate fallback: item -> subcategory -> product type.'
  seasonality: 'Seasonality: category -> product type.'
  analogs: B2 = H x similar-FPG per-household rate; B3 = B2 shrunk toward the national
    rate.
  synthetic_label: Synthetic results are interface tests, not rankings.
  excluded_methods: POP (rejected), VISUELLE (blocked), TimeGPT (dropped), Moirai
    and TimesFM 3.0 (non-commercial).
  polars_swap_parity: A Polars replacement for existing pandas code keeps the original
    as *_reference, adds a parity test covering evaluator and scalable_eval outputs,
    and a benchmark script reporting the median of repeats with machine specs. Protected
    evaluator and util.hash_frame are never swapped.
  installer_safety: 'Installer scripts never use sudo, support --dry-run, and use
    set -Eeuo pipefail with an ERR trap (PowerShell: $ErrorActionPreference = ''Stop'').
    The uv installer is pinned to a version (0.13.5 today) and run only if its sha256
    matches the value recorded in the script; that value is one we computed ourselves
    and is labelled observed. The installer is told not to edit shell profiles (UV_NO_MODIFY_PATH=1).'
  installer_ux: 'Installer output uses an [ok] ASCII fallback, a Fix: hint on failure
    and exit 2 for bad usage; each step line reports its measured elapsed time. Scripts
    honour NO_COLOR and offer --help, --version, --quiet, --verbose and --non-interactive;
    the own-data prompt only appears on a TTY.'
  installer_env: Installers do not hard-code --index-url or --proxy, so HTTP(S)_PROXY,
    NO_PROXY, UV_* and PIP_INDEX_URL apply; a pip fallback (--no-install-uv) exists.
  installer_checks: Every flag in xferAI_setup.sh --help is exercised in tests/unit/test_setup_script.py,
    which also has a pty prompt test and stubbed (no network) uv-missing, checksum-mismatch,
    pip-fallback and lightgbm-failure tests. ci.yml runs shellcheck --severity=info
    on xferAI_setup.sh and bootstrap.sh, runs PSScriptAnalyzer per file and fails
    on any finding, runs a fresh run and a rerun of the setup script on ubuntu, macos
    and windows, and pins every action to a commit SHA. Windows behaviour is claimed
    only from Windows CI.
